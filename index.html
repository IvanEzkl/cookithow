<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <header>
        <!-- Logo -->
        <a href="#" class="logo">CookSync</a>

        <!-- Menu Icon -->
        <div class="bx bx-menu" id="menu-icon">

        </div>

        <!-- Nav Bar -->
        <ul class="navbar">
            <li><a href="#home" class="home">Home</a></li>
            <li><a href="#cuisines" class="cuisines">Cuisines</a></li>
            <li><a href="#projects" class="projects">Our Team</a></li>
        </ul>
        <ul class="navbar">
            <li>
              <a href="#signup" class="Signup" onclick="window.open('/login.html', '_blank'); return false;">Join Us</a>
            </li>

        </ul>
    </div>
    </header>

    <div class="recipe-finder-container">
      <h1>Recipe Finder</h1>

      <form id="search-form" class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search by name (ex. 'carrot')"
        />

        <button type="submit" id="search-button">Search</button>
      </form>

      <div class="random-button-container">
        <button id="random-button" class="random-button">
          Get Random Recipe
        </button>
      </div>
      
      <div class="filter-controls">
  <select id="category-select">
    <option value="">Filter by Category</option>
  </select>
  <select id="area-select">
    <option value="">Filter by Area</option>
  </select>
</div>
      <div class="message" id="message-area">
        Search for a recipe or get a random one!
      </div>

      <div class="results-grid" id="results-grid"></div>
    </div>

    <div class="modal-container hidden" id="recipe-modal">
      <div class="modal-content">
        <button id="modal-close-btn" class="modal-close-btn">+</button>
        <div id="recipe-details-content"></div>
      </div>
    </div>
    </section>
    <body>
    <section id="projects">Our Team</section>
    <div class="gallery">
        <ul class="cards">
          <li>0</li>
      <img src="/assets/pogi.jpg" alt="Member 1" class="team-photo" />
      <h3>Member 1</h3>
      <p>Role: Frontend Developer</p>
      </div>
      <div class="team-member">
      <img src="images/2.jpg" alt="Member 2" class="team-photo" />
      <h3>Member 2</h3>
      <p>Role: Backend Developer</p>
      </div>
      <div class="team-member">
      <img src="images/3.jpg" alt="Member 3" class="team-photo" />
      <h3>Member 3</h3>
      <p>Role: UI/UX Designer</p>
      </div>
      <div class="team-member">
      <img src="images/3.jpg" alt="Member 3" class="team-photo" />
      <h3>Member 3</h3>
      <p>Role: UI/UX Designer</p>
          <body>
    <script src="main.js"></script>
  </body>
</html>
