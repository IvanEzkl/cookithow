<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <header>
        <!-- Logo -->
        <a href="#" class="logo">CookITHow</a>

        <!-- Menu Icon -->
        <div class="bx bx-menu" id="menu-icon"></div>

        <!-- Nav Bar -->
        <ul class="navbar">
            <li>
              <a href="#home" class="home" onclick="event.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' });">Home</a>
            </li>
            <li>
              <a href="#recipe-finder" class="cuisines" onclick="event.preventDefault(); scrollToRecipeFinder(700);">Cuisines</a>
            </li>
            <li>
              <a href="#projects" class="ourteam" onclick="event.preventDefault(); document.querySelector('#projects').scrollIntoView({ behavior: 'smooth' });">Our Team</a>
            </li>
        </ul>
        <ul class="navbar">
            <li>
              <a href="#signup" class="Signup" onclick="window.open('login.html'); return false;">Log In</a>
            </li>
        </ul>
    </header>

    <div class="recipe-finder-container" id="recipe-finder">
      <h1>Recipe Finder</h1>

      <form id="search-form" class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search by name (ex. 'carrot')"
        />
        <button type="submit" id="search-button">Search</button>
      </form>

      <div class="random-button-container">
        <button id="random-button" class="random-button">
          Get Random Recipe
        </button>
      </div>
      
      <div class="filter-controls">
        <select id="category-select">
          <option value="">Filter by Category</option>
        </select>
        <select id="area-select">
          <option value="">Filter by Area</option>
        </select>
      </div>
      <div class="message" id="message-area">
        Search for a recipe or get a random one!
      </div>

      <div class="results-grid" id="results-grid"></div>

      <div class="modal-container hidden" id="recipe-modal">
        <div class="modal-content">
          <button id="modal-close-btn" class="modal-close-btn">+</button>
          <div id="recipe-details-content"></div>
        </div>
      </div>
        </div>

    <section id="projects">
      <h2 class="our-team-title">Our Team</h2>
      <div class="team-spotlight-container">
      <div class="team-spotlight-card">
        <div class="team-photo-glow">
        <img id="team-photo" src="/assets/pogi.jpg" alt="Regod" class="team-photo-large" />
        </div>
        <div class="team-spotlight-info">
        <div class="team-hello">Hello World, I'm</div>
        <div class="team-name" id="team-name">Regod</div>
        <div class="team-role" id="team-role">Frontend Developer</div>
        <div class="team-desc" id="team-desc"></div>
        </div>
      </div>
      </div>
    </section>
    <script src="main.js"></script>
  </body>
</html>
